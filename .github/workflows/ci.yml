name: ci

# The gate that was missing when two red commits reached main: `go test`
# output filtered through a pipe in a local shell reports the PIPELINE's
# exit status, not the test result. CI runs the real command, unfiltered.
#
# This workflow is the GATE only. The release pipeline (version bump,
# six-platform artifacts, signing, GitHub release) is release.yml.

on:
  push:
    branches: [main]
  pull_request:
  # A manual dispatch runs the full gate.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # fetch-depth 0 so the secret scan below sees the whole history, not just
      # the single commit a shallow checkout would give it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # CGO-free is a product guarantee (PRD §5): a build that needs a C
      # toolchain must fail here, not on a user's machine.
      - name: Build (CGO disabled)
        env:
          CGO_ENABLED: "0"
        run: go build -o xdev ./cmd/xdev

      - name: Vet
        run: go vet ./...

      # Search tools prefer the rg/fd fast paths and fall back to pure Go
      # when absent. Ubuntu ships fd as `fdfind`, so link it to the name
      # the code looks up; without this the fd path is never exercised.
      # ast-grep comes from its own release, not apt.
      - name: Install optional search binaries
        run: |
          sudo apt-get update && sudo apt-get install -y ripgrep fd-find
          sudo ln -sf "$(command -v fdfind)" /usr/local/bin/fd
          ast_grep_version=0.45.3
          curl -fsSL -o /tmp/ag.zip "https://github.com/ast-grep/ast-grep/releases/download/${ast_grep_version}/app-x86_64-unknown-linux-gnu.zip"
          unzip -o -q /tmp/ag.zip -d /tmp/ag
          sudo cp /tmp/ag/ast-grep /usr/local/bin/ast-grep
          ast-grep --version

      - name: Test
        run: go test -count=1 ./...

      - name: Test (race)
        run: go test -race -count=1 ./internal/...

      - name: Format drift
        run: |
          unformatted="$(gofmt -l . | grep -v '^testdata/' || true)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi

      - name: Boot smoke
        run: ./xdev version

      # M8 memory proof: the worst-case transcript test under gctrace.
      # The test itself asserts the heap budget; gctrace makes the GC
      # behavior visible in the log for a human reading a failure.
      - name: Memory proof (worst-case transcript, gctrace)
        env:
          GODEBUG: gctrace=1
        # The verifier must BE the exit status: GitHub's default shell has no
        # pipefail, so `... | tail -40` made this step report tail's success and
        # the M8 budget could regress green. The PASS assertion also catches a
        # renamed test, which `-run` would otherwise turn into a silent no-op.
        run: |
          set -o pipefail
          log="$(mktemp)"
          if ! go test -count=1 -run TestWorstCaseTranscriptStaysUnderBudget -v ./internal/session/ >"$log" 2>&1; then
            tail -40 "$log"
            exit 1
          fi
          tail -40 "$log"
          grep -q -- '--- PASS: TestWorstCaseTranscriptStaysUnderBudget' "$log"

      # M8: untrusted-input surfaces get a short fuzz pass on every run.
      # Longer campaigns are a release activity; this catches the
      # regression that reintroduces a panic path.
      - name: Fuzz (short)
        run: |
          go test -run FuzzSessionLoad -fuzz FuzzSessionLoad -fuzztime 20s ./internal/session/
          go test -run FuzzParsePartial -fuzz FuzzParsePartial -fuzztime 20s ./internal/ai/sse/

      # M8: known-CVE scan. Pinned deps + govulncheck together are the
      # supply-chain gate (PRD §IV.9.7).
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

      # Pre-publication gate: a secret that reaches main has already reached
      # every clone, and it is in the history as much as in the tip. The
      # path allowlist in .gitleaks.toml is what keeps the credential-SHAPED
      # test fixtures out of the report.
      - name: Secret scan (gitleaks)
        run: |
          gitleaks_version=8.30.1
          curl -fsSL -o /tmp/gl.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${gitleaks_version}/gitleaks_${gitleaks_version}_linux_x64.tar.gz"
          tar -xzf /tmp/gl.tar.gz -C /tmp
          sudo cp /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks detect --source . --redact

  cross:
    # Six-platform cross-compile is a Goal-1 promise; catch breakage early.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goos: linux, goarch: amd64}
          - {goos: linux, goarch: arm64}
          - {goos: darwin, goarch: amd64}
          - {goos: darwin, goarch: arm64}
          - {goos: windows, goarch: amd64}
          - {goos: windows, goarch: arm64}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -o /dev/null ./cmd/xdev
