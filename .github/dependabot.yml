# Dependabot: keep the module graph and the CI actions current.
# Both ecosystems here are cheap to review and expensive to let rot: a stale
# setup-go/actions pair silently breaks the release pipeline, and a stale
# dependency is what govulncheck in ci.yml exists to catch.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      include: scope
    groups:
      go-modules:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /.github
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
    commit-message:
      prefix: "ci"
      include: scope
